# params.toml — le seul endroit pour les constantes du simulateur Kalman, étape 2 (boucle fermée).
#
# Le bloc « step0 » (en bas) vient de l'étape 1, inchangé : titration du 2026-10-16 à 800 nm, IRF,
# fond, Langmuir. Le reste se règle ici. Chaque seuil de [criteres] dit à quoi il est adossé.

[trajectoire]
dt_s = 0.1                 # 10 Hz
duree_s = 180.0            # 1 800 pas (durées doublées le 2026-10-19 : le chlore a le temps de se stabiliser)

[photons]
N_bleu = 1000.0                    # budget des tests
balayage = [1000.0, 3000.0]        # N = 300 abandonné (5a échoue 30 à 42 % du temps)

[derive]
# g multiplie le seul canal jaune ; aucune lecture ne le connaît (repris de l'étape 1).
forme = "rampe"
alpha = 0.0
balayage_alpha = [0.0, 0.10, 0.20]     # aucune, rampe 10 %, rampe 20 % ; plus le saut ci-dessous
saut = 0.05
t_saut_s = 90.0

[lectures]
C_reference_mM = 20.0
gain_minimal_jaune = 0.10
grille_calibration_mM = [0.0, 131.0, 0.25]
bornes_fraction = [-0.5, 1.5]
iterations_max = 60
diffusion_5a = true             # bloc clos de l'étape 1 (composante de diffusion dans 5a)

[physiologie]
# dC/dt = J_eNpHR(u) − k_pompe·(C − C_repos) + ξ ;  J_eNpHR(u) = J_max·u/(u + u_demi), u ∈ [0, 1]
C_repos_mM = 5.0
k_pompe_par_s = 0.05            # τ = 20 s ; posé, pas mesuré : balayé (robustesse)
J_max_mM_par_s = 8.0            # 30 mM en ~2 s à pleine commande ; posé : balayé
u_demi = 0.3
sigma_xi_mM = 0.05              # bruit physiologique, par pas de 0,1 s (opinion : 0,5 mM d'écart-type stationnaire)
balayage_k_pompe = [0.02, 0.05, 0.15]
balayage_J_max = [4.0, 8.0, 16.0]

[scenario]
# consigne : [début (s), valeur (mM)] ; la boucle est inactive avant t_activation (u = 0)
consigne = [[0.0, 5.0], [20.0, 25.0], [100.0, 10.0], [130.0, 15.0]]
t_activation_s = 20.0
# phases de la consigne, pour les métriques par phase
phases = [["repos", 0.0, 20.0], ["creneau_haut", 20.0, 60.0], ["plateau", 60.0, 100.0], ["descente", 100.0, 130.0], ["creneau_bas", 130.0, 180.0]]
# fenêtres de régime établi (erreur de régulation, signatures de couplage)
etabli = [[60.0, 100.0], [160.0, 180.0]]
# transitoire / plateau, pour la blancheur par phase : |dC_vrai/dt| au-dessus / en dessous de ces seuils
seuil_transitoire_mM_par_s = 0.5
seuil_plateau_mM_par_s = 0.1

[kalman]
# état (C, g, ġ) : C suit la physiologie (u connu), g et ġ le modèle OU de l'étape 1 (repris tel quel)
sigma_C0_mM = 1.2               # σ_C,0 par pas : le σ_C de l'étape 1
sigma_wg = 1e-4                 # sur g, par pas (OU de l'étape 1)
sigma_wgp = 1e-4                # sur ġ (s⁻¹), par pas
tau_ou_s = 30.0
sigma_gp0 = 2e-3
C0_mM = 5.0
sigma_C0_init_mM = 2.0
g0 = 1.0
sigma_g0 = 0.05
# Q(u) : σ_C²(u) = σ_C,0² + β·(J(u)·Δt)², β = erreur relative sur le flux, au carré
balayage_beta = [0.0, 0.01, 0.04, 0.1, 0.25]
# filtre « ratio seul » (course 4) : deux états (C, g), même Q sur C. Sans 5a, g n'est pas observable :
#   :ratio        g figé à 1 (σ nuls) — la calibration unique, ce que fait la pratique ; référence de la course 4
#   :ratio_libre  g libre (σ_g0, marche aléatoire) — sans ancre, il dérive : montré comme pathologie
sigma_wg_ratio_libre = 1e-4
# diagnostic de la course 2 (hors plan) : σ_C,0 plus petits, pour voir si Q(u) agit quand le modèle de C est cru
balayage_sigma_C0_diagnostic = [1.2, 0.3, 0.1]
# filtre à quatre états (course 7) : k_pompe dans l'état
k_pompe_init_par_s = 0.05
sigma_k_init_par_s = 0.03
sigma_wk_par_s = 1e-6           # par pas, pour la santé numérique seulement

[regulateur]
# PI sur l'estimation, anti-emballement par intégration conditionnelle ; Kp en u par mM, Ki en u par mM·s
tau_BF_cible_s = 3.0            # cible 2–5 s ; Kp = (1/τ − k_pompe)/(dJ/du au maintien de C_ref)
C_ref_reglage_mM = 25.0
Ki_sur_Kp_par_s = 0.3333        # Ki = Kp/τ_BF
balayage_Kp_decades = [-0.5, 1.0]     # Kp × 10^[−0,5 … 1,0], une décade et demie
points_par_decade = 5
facteur_coude_beta = 0.7        # β balayé à Kp = coude − 30 %
# variantes : A aveugle, B zone morte √(P₁₁/c), C gain × σ₀²/(P₁₁/c + σ₀²) ; c = P₁₁/err² mesuré (course 3)
Kp_variante_C_facteur = 2.0     # gain nominal de C doublé : le facteur vaut ½ quand P₁₁/c = σ₀² (médiane de la course 3)

[course]
graine = 20261018               # graine du pas k de la répétition r : graine + 10 000·r + k (par condition, pas par course)
repetitions_performance = 8
repetitions_statistiques = 40   # innovations et signatures de couplage
fin_biais_s = 60.0
verification_R_tirages = 4000

[criteres]
# Chaque seuil est adossé à une valeur théorique, à une mesure de référence, ou marqué « opinion ».
innovation_transitoire_max = 0.05           # référence : −0,274 à l'étape 1
autocorr_par_phase_max = 0.10               # blancheur théorique d'un filtre bien spécifié
hausse_rmse_plateaux_max = 0.05             # référence : course 1, même budget
P11_sur_err2 = [0.5, 2.0]                   # conservé de l'étape 1
biais_filtre_phases_mM = 0.30               # remesuré contre la bonne dynamique
erreur_regulation_etablie_mM = 0.5          # 10 % du créneau de 20 mM
erreur_reelle_fusion_rampe20_mM = 1.5       # la fusion doit tenir sa promesse
erreur_reelle_ratio_rampe20_mM = 4.0        # attendu, sinon la question 2 répond non
accord_fisher_pct = 5.0                     # tenu à 0,6 et 0,4 % à l'étape 1
rho12_hausse_max = 0.1                      # référence : boucle ouverte au même budget
marge_coude_min = 3.0                       # opinion, à réviser après la course 5
# signatures de couplage (seuils d'alerte du plan)
agitation_sur_A_max = 2.0
correlation_P11_agitation_max = 0.3
respiration_P11_max = 0.5
coude_rapport = 1.5             # coude : agitation/Kp dépasse 1,5 × sa valeur au plus petit Kp (règle fixée d'avance)

[video]
ips = 30                        # 1 800 images : 60 s de vidéo pour 180 s simulées (×3)

